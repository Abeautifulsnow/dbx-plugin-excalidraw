name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    # NOTE: the plugin-sdk-v1 ref no longer exists upstream; main carries the
    # current plugin workflow. Re-pin to a tag when upstream publishes one.
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@main
    with:
      release-tag: ${{ github.event.release.tag_name }}
      # The packager only stages directories; build the frontend into ui/ first.
      package-command: npm --prefix frontend ci && npm --prefix frontend run build && dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.9
